apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  sources:
    - repoURL: https://helm.openwebui.com/
      chart: open-webui
      targetRevision: 16.0.0
      helm:
        releaseName: open-webui
        valueFiles:
          - $values/ollama/open-webui-values.yaml
    - repoURL: https://github.com/ykantoni/terraform-proxclus-k8s-apps.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
