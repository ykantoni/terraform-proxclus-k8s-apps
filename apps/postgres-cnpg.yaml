apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-cnpg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  source:
    repoURL: https://github.com/ykantoni/terraform-proxclus-k8s-apps.git
    targetRevision: main
    path: postgres-cnpg/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Cluster CRD comes from the cnpg-operator Application; until it's
      # registered, skip the dry run and let retry pick it up.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
