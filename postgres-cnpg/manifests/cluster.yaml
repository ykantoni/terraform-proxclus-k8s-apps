# 1 primary + (instances - 1) streaming-replication standbys, wired up by the
# operator. Credentials are generated by CNPG into the postgres-superuser and
# postgres-app Secrets, never stored in Git.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: app
      owner: app
