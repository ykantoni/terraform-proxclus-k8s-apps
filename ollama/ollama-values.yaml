ollama:
  gpu:
    enabled: true
    type: nvidia
    number: 1
  # Empty: pick models from Open WebUI's model manager after deploying.
  models:
    pull: []

service:
  type: LoadBalancer
  port: 11434

# No storageClass: the PVC gets the cluster's default StorageClass (longhorn),
# dynamically provisioned.
persistentVolume:
  enabled: true
  size: 20Gi

# Created by terraform-proxclus-k8s-infra's gpu-operator addon, which also
# applies the nvidia.com/gpu.present label to GPU nodes.
runtimeClassName: nvidia
nodeSelector:
  nvidia.com/gpu.present: "true"
